[project]
name = "pydsky"
version = "2025.02.18"
description = "Apollo DSKY (Display & Keyboard) emulator"
authors = [
    {name = "Mike Stewart"},
    {name = "Ryan Malloy", email = "ryan@supported.systems"},
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "qtpy>=2.0",
]

[project.optional-dependencies]
pyqt5 = ["PyQt5>=5.15"]
pyqt6 = ["PyQt6>=6.0"]
pyside6 = ["PySide6>=6.0"]

[project.scripts]
pydsky = "pydsky.app:main"
pydsky-uplink = "pydsky.uplink:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydsky"]

[tool.ruff]
line-length = 120
